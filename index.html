<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1B4332">
<title>植誌 BOTANICA</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#F7F5F0;color:#2D312E;padding-bottom:88px}
header{background:#F7F5F0;position:sticky;top:0;z-index:20;border-bottom:1px solid #E6E2D8;padding:12px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:18px;color:#1B4332;font-weight:800}
.sub{font-size:11px;color:#6B706C;margin:2px 0 8px}
button{border:none;cursor:pointer;font-family:inherit}
button:active{opacity:.75;transform:scale(.96)}
.b-ico{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid #E2DDD2;font-size:14px}
.b-pri{background:#1B4332;color:#fff;font-size:12px;font-weight:700;padding:0 14px;height:34px;border-radius:99px}
.b-red{background:#B91C1C;color:#fff;font-size:12px;font-weight:700;padding:0 14px;height:36px;border-radius:99px}
.b-gry{background:#EAE6DC;color:#3A3F3B;font-size:12px;font-weight:700;padding:0 14px;height:36px;border-radius:99px}
.pill{background:#fff;border:1px solid #E6E2D8;padding:4px 10px;border-radius:99px;font-size:11px;white-space:nowrap}
.warn{background:#FFF4E5;border-color:#F5D7B0;color:#9C5700}
.q{flex:1;min-width:0;background:#fff;border:1px solid #E6E2D8;border-radius:99px;padding:5px 12px;font-size:12px;outline:0}
.cats{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.cats::-webkit-scrollbar{display:none}
.c-btn{background:#fff;border:1px solid #E6E2D8;color:#5C615D;padding:5px 12px;border-radius:99px;font-size:12px;white-space:nowrap}
.c-btn.on{background:#1B4332;color:#fff;font-weight:700}
main{max-width:960px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:#fff;border-radius:20px;overflow:hidden;border:1px solid #EAE6DC}
.c-img{position:relative;height:175px;background:#EAE6DC;cursor:pointer}
.c-img img{width:100%;height:100%;object-fit:cover}
.c-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.68),transparent 60%)}
.c-tag{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.93);color:#1B4332;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px}
.c-more{position:absolute;bottom:10px;right:12px;background:rgba(255,255,255,.25);color:#fff;font-size:10px;padding:2px 8px;border-radius:99px}
.c-tls{position:absolute;top:10px;right:10px;display:flex;gap:5px;z-index:5}
.t-btn{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.95);font-size:12px}
.c-tit{position:absolute;bottom:10px;left:14px;right:75px;color:#fff}
.c-tit h3{font-size:16px}
.c-tit p{font-size:10px;opacity:.85;font-style:italic}
.c-bd{padding:12px 14px}
.c-mt{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#8C918D;margin-bottom:6px}
.bdg{padding:2px 9px;border-radius:99px;font-weight:700}
.ok{background:#E8F3EE;color:#1B4332}.due{background:#FEF3C7;color:#B45309}.ov{background:#FEE2E2;color:#B91C1C}
.c-nt{font-size:12px;color:#4A4E4B;line-height:1.45;margin-bottom:10px}
.c-ac{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid #F2EFE9;padding-top:10px}
.ab{padding:8px 0;border-radius:12px;font-size:12px;font-weight:700}
.aw{background:#EDF6F9;color:#006D77}.af{background:#FFF8EB;color:#B45309}.an{background:#F4F2ED;color:#3A3F3B}
.lbox{background:#fff;border-radius:20px;padding:16px;border:1px solid #EAE6DC}
.li{border-left:3px solid #2D6A4F;padding-left:10px;margin-bottom:14px}
.lh{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#1B4332}
.lt{font-size:11px;color:#8C918D;font-weight:400}
.la{font-size:12px;font-weight:600;margin:2px 0}
.ln{font-size:12px;color:#6B706C;background:#F7F5F0;padding:6px 10px;border-radius:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #E6E2D8;display:flex;justify-content:space-around;padding:7px 0;z-index:20}
.nb{background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;color:#8C918D;padding:2px 24px}
.nb.on{color:#1B4332;font-weight:700}
.fab{position:fixed;bottom:70px;right:14px;width:46px;height:46px;border-radius:50%;background:#1B4332;color:#fff;font-size:19px;box-shadow:0 4px 12px rgba(0,0,0,.22);z-index:25;border:2px solid #F7F5F0}
.mod{display:none;position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:50;align-items:center;justify-content:center;padding:14px}
.mc{background:#fff;border-radius:22px;width:100%;max-width:420px;padding:18px;max-height:88vh;overflow-y:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:12px;font-weight:700;color:#4A4E4B;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;background:#F7F5F0;border:1px solid #E2DDD2;border-radius:10px;padding:9px 10px;font-size:13px;font-family:inherit;outline:0}
.chp{background:#E8F3EE;color:#1B4332;font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;margin:0 4px 6px 0}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.sb{background:#F7F5F0;border-radius:12px;padding:8px;text-align:center;font-size:11px}
.wb{background:#FAF8F5;border-left:3px solid #1B4332;padding:8px 10px;margin-bottom:8px;font-size:12px;line-height:1.5}
.aiw{display:none;position:fixed;bottom:126px;right:14px;left:14px;max-width:370px;margin-left:auto;height:380px;background:#fff;border-radius:22px;box-shadow:0 8px 26px rgba(0,0,0,.22);border:1px solid #E2DDD2;z-index:45;flex-direction:column;overflow:hidden}
.aih{background:#1B4332;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.aib{flex:1;padding:10px;overflow-y:auto;background:#FAF8F5;font-size:12px;line-height:1.5}
.am{background:#fff;padding:8px 10px;border-radius:14px;margin-bottom:8px;border:1px solid #EAE6DC;white-space:pre-wrap}
.am.me{background:#1B4332;color:#fff;margin-left:28px;border:0}
.aif{padding:8px;background:#fff;border-top:1px solid #EAE6DC;display:flex;gap:6px}
.aif input{flex:1;background:#F7F5F0;border:0;border-radius:99px;padding:7px 12px;font-size:12px;outline:0}
#tst{display:none;position:fixed;top:68px;left:50%;transform:translateX(-50%);background:#1B4332;color:#fff;font-size:12px;font-weight:700;padding:8px 16px;border-radius:99px;z-index:60;white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="row"><h1>🌿 植誌 BOTANICA</h1><div class="row"><button type="button" class="b-ico" onclick="oMod('m-set')">⚙️</button><button type="button" class="b-pri" onclick="oAdd()">＋ 收錄植物</button></div></div>
  <div class="sub">跨領域植物圖鑑・深度百科與養護手札</div>
  <div class="row"><span class="pill">總收錄 <b id="s1">0</b></span><span class="pill warn">待補水 <b id="s2">0</b></span><input id="q" class="q" oninput="ren()" placeholder="搜尋植物或介質..."></div>
  <div id="cats" class="cats"></div>
</header>
<main>
  <section id="v1"><div id="grid" class="grid"></div></section>
  <section id="v2" style="display:none"><div class="lbox"><div class="row" style="margin-bottom:12px"><b style="color:#1B4332">📖 即時養護日誌</b><span style="font-size:11px;color:#6B706C">共 <b id="s3">0</b> 筆</span></div><div id="logs"></div></div></section>
</main>
<div id="tst"></div>
<button type="button" class="fab" onclick="tAI()">✨</button>
<nav><button type="button" id="n1" class="nb on" onclick="go('v1')"><span>🪴</span>植物圖鑑</button><button type="button" id="n2" class="nb" onclick="go('v2')"><span>📖</span>即時日誌</button></nav>

<div id="m-det" class="mod"><div class="mc">
  <div class="mh"><div><span id="dc" style="font-size:11px;color:#2D6A4F;font-weight:700"></span><h3 id="dn" style="font-size:18px;color:#1B4332"></h3><p id="dl" style="font-size:11px;color:#6B706C;font-style:italic"></p></div><button type="button" class="b-ico" onclick="cMod('m-det')">✕</button></div>
  <img id="di" src="" style="width:100%;height:175px;object-fit:cover;border-radius:14px">
  <div class="sg"><div class="sb">☀️ 光照<br><b id="d1" style="color:#1B4332"></b></div><div class="sb">💦 濕度<br><b id="d2" style="color:#1B4332"></b></div><div class="sb">💧 週期<br><b id="d3" style="color:#1B4332"></b></div></div>
  <div class="wb"><b style="color:#1B4332">🌍 原生棲地與習性：</b><span id="d4"></span></div>
  <div class="wb"><b style="color:#1B4332">🪴 專屬介質配方：</b><span id="d5"></span></div>
  <div class="wb"><b style="color:#1B4332">⚠️ 養護關鍵與禁忌：</b><span id="d6"></span></div>
  <div class="c-ac"><button type="button" class="ab aw" onclick="dAct('w')">💧 澆水</button><button type="button" class="ab af" onclick="dAct('f')">🧪 施肥</button><button type="button" class="ab an" onclick="dAct('n')">📝 筆記</button></div>
</div></div>

<div id="m-add" class="mod"><div class="mc">
  <div class="mh"><h3 id="mt" style="color:#1B4332">收錄新植物</h3><button type="button" class="b-ico" onclick="cMod('m-add')">✕</button></div>
  <input type="hidden" id="fid">
  <div class="fld"><label>植物名稱 *</label><input id="fn" placeholder="例如：女王鹿角蕨、神聖乳香"></div>
  <div class="fld"><label>學名（選填）</label><input id="fl" placeholder="Platycerium wandae"></div>
  <div class="fld"><label>所屬領域</label><select id="fc"><option>附生鹿角蕨</option><option>橄欖科植物</option><option>雨林觀葉</option><option>塊根植物</option><option>食蟲植物</option><option>沙漠多肉</option><option>蘭科植物</option></select></div>
  <div class="row"><div class="fld" style="flex:1"><label>澆水週期(天)</label><input type="number" id="fd" value="5"></div><div class="fld" style="flex:1"><label>光照需求</label><input id="flg" value="明亮散射光"></div></div>
  <div class="fld"><label>專屬介質配方</label><input id="fs" placeholder="例如：智利水苔 80% + 樹皮 20%"></div>
水週期 (天)</label><input type="number" id="f-day" value="5" min="1" max="90" /></div>
    <div class="field"><label>上傳實拍照片 或 貼上圖片網址</label>
      <input type="file" id="f-file" accept="image/*" style="margin-bottom:6px" />
      <input type="url" id="f-url" placeholder="https://..." />
    </div>
    <div class="field"><label>養護手札</label><textarea id="f-note" rows="2" placeholder="記錄光照、濕度與介質..."></textarea></div>
    <button type="button" class="btn-primary" style="width:100%;height:42px;font-size:14px" data-cmd="save-plant">儲存至圖鑑</button>
  </div>
</div>

<div id="m-set" class="modal">
  <div class="modal-card">
    <div class="modal-head"><h3>設定與備份</h3><button type="button" class="btn-icon" data-cmd="close-set">✕</button></div>
    <div class="field"><label>Google Gemini API Key（選填）</label><input type="password" id="s-key" placeholder="AIzaSy..." /></div>
    <button type="button" class="btn-primary" style="width:100%;margin-bottom:12px" data-cmd="save-key">儲存金鑰</button>
    <div style="display:flex;gap:8px">
      <button type="button" class="act-btn act-n" style="flex:1" data-cmd="export-json">⬇️ 匯出備份</button>
      <button type="button" class="act-btn b-over" style="flex:1" data-cmd="reset-all">🔄 重置範例</button>
    </div>
  </div>
</div>

<script>
var INIT_P = [
  { id:'p1', name:'二叉鹿角蕨', latin:'Platycerium bifurcatum', cat:'附生鹿角蕨', day:5, last:Date.now()-5*864e5, img:'https://unsplash.com', note:'上板栽培，水苔變輕變乾時整板泡水15分鐘，保持通風。' },
  { id:'p2', name:'女王鹿角蕨', latin:'Platycerium wandae', cat:'附生鹿角蕨', day:4, last:Date.now()-2*864e5, img:'https://unsplash.com', note:'大型附生種，喜歡溫暖高濕與明亮散射光，避免營養葉積水。' },
  { id:'p3', name:'神聖乳香', latin:'Boswellia sacra', cat:'橄欖科植物', day:8, last:Date.now()-6*864e5, img:'https://unsplash.com', note:'橄欖科經典芳香樹脂樹種，高比例顆粒土與充足日照，冬季減水。' },
  { id:'p4', name:'索馬利亞沒藥', latin:'Commiphora myrrha', cat:'橄欖科植物', day:9, last:Date.now()-4*864e5, img:'https://unsplash.com', note:'橄欖科旱生灌木，枝幹具獨特香氣；盆土乾透再澆透。' },
  { id:'p5', name:'白錦龜背竹', latin:'Monstera Albo', cat:'雨林觀葉', day:4, last:Date.now()-4*864e5, img:'https://unsplash.com', note:'明亮散射光，空氣濕度維持60%以上，樹皮椰塊疏水介質。' },
  { id:'p6', name:'象牙宮', latin:'Pachypodium gracilius', cat:'塊根植物', day:10, last:Date.now()-7*864e5, img:'https://unsplash.com', note:'全日照通風，生長期乾透澆透，冬季落葉休眠期嚴格斷水。' },
  { id:'p7', name:'蘋果豬籠草', latin:'Nepenthes ampullaria', cat:'食蟲植物', day:2, last:Date.now()-2*864e5, img:'https://unsplash.com', note:'使用低TDS純水或雨水，水苔保持微濕不積水。' },
  { id:'p8', name:'生石花', latin:'Lithops', cat:'沙漠多肉', day:14, last:Date.now()-10*864e5, img:'https://unsplash.com', note:'高比例顆粒土，春季蛻皮期完全不可澆水。' },
  { id:'p9', name:'蝴蝶蘭', latin:'Phalaenopsis', cat:'蘭科植物', day:7, last:Date.now()-5*864e5, img:'https://unsplash.com', note:'氣生根由綠轉銀白色再澆水，避開葉心積水。' }
];
var INIT_L = [
  { id:'l1', t:Date.now()-72e5, p:'二叉鹿角蕨', a:'💧 完成泡水補給', n:'水苔已吸飽水，狀態健康' },
  { id:'l2', t:Date.now()-864e5, p:'神聖乳香', a:'📝 狀態觀察紀錄', n:'日照充足，新枝葉散發淡雅樹脂香氣' }
];
var P = JSON.parse(localStorage.getItem('bp_v2') || 'null') || INIT_P;
var L = JSON.parse(localStorage.getItem('bl_v2') || 'null') || INIT_L;
var curCat = '全部', tmpImg = '';

function sync() {
  try { localStorage.setItem('bp_v2', JSON.stringify(P)); localStorage.setItem('bl_v2', JSON.stringify(L)); } catch(e) {}
  document.getElementById('st-total').textContent = P.length;
  document.getElementById('st-due').textContent = P.filter(function(x){ return Math.ceil((x.last + x.day*864e5 - Date.now())/864e5) <= 0; }).length;
}
function toast(m) {
  var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block';
  setTimeout(function(){ t.style.display = 'none'; }, 2000);
}
function render() {
  var cats = ['全部'];
  P.forEach(function(x){ if(cats.indexOf(x.cat)===-1) cats.push(x.cat); });
  document.getElementById('cats').innerHTML = cats.map(function(c){
    return '<button type="button" class="cat-btn'+(curCat===c?' active':'')+'" data-cat="'+c+'">'+c+'</button>';
  }).join('');
  var q = document.getElementById('q').value.toLowerCase();
  var list = P.filter(function(x){ return (curCat==='全部'||x.cat===curCat) && (x.name.toLowerCase().indexOf(q)!==-1 || (x.note||'').toLowerCase().indexOf(q)!==-1); });
  var fb = 'https://unsplash.com';
  document.getElementById('grid').innerHTML = list.map(function(x){
    var left = Math.ceil((x.last + x.day*864e5 - Date.now())/864e5);
    var b = left<0 ? '<span class="badge b-over">逾期 '+Math.abs(left)+' 天</span>' : left===0 ? '<span class="badge b-due">今日需補水</span>' : '<span class="badge b-ok">'+left+' 天後澆水</span>';
    return '<div class="card"><div class="card-img-wrap"><img src="'+(x.img||fb)+'" onerror="this.src=\''+fb+'\'" /><div class="card-overlay"></div><span class="card-tag">'+x.cat+'</span><div class="card-tools"><button type="button" class="tool-btn" data-edit="'+x.id+'">✏️</button><button type="button" class="tool-btn" data-del="'+x.id+'">🗑️</button></div><div class="card-title"><h3>'+x.name+'</h3>'+(x.latin?'<p>'+x.latin+'</p>':'')+'</div></div><div class="card-body"><div class="card-meta"><span>每 '+x.day+' 天補水</span>'+b+'</div><p class="card-notes">'+(x.note||'尚無手札')+'</p><div class="card-actions"><button type="button" class="act-btn act-w" data-act="w" data-id="'+x.id+'">💧 澆水</button><button type="button" class="act-btn act-f" data-act="f" data-id="'+x.id+'">🧪 施肥</button><button type="button" class="act-btn act-n" data-act="n" data-id="'+x.id+'">📝 筆記</button></div></div></div>';
  }).join('');
  document.getElementById('logs').innerHTML = L.map(function(l){
    var d = new Date(l.t), ts = (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    return '<div class="log-item"><div class="log-head"><span>'+l.p+'</span><span class="log-time">'+ts+'</span></div><div class="log-act">'+l.a+'</div>'+(l.n?'<div class="log-note">'+l.n+'</div>':'')+'</div>';
  }).join('');
  sync();
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('f-file').addEventListener('change', function(e){
  var f = e.target.files && e.target.files.item(0); if(!f) return;
  var r = new FileReader();
  r.onload = function(ev){
    var im = new Image();
    im.onload = function(){
      var c = document.createElement('canvas'), s = Math.min(1, 500/im.width);
      c.width = im.width*s; c.height = im.height*s;
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      tmpImg = c.toDataURL('image/jpeg',0.7);
      toast('📸 照片已載入');
    };
    im.src = ev.target.result;
  };
  r.readAsDataURL(f);
});

document.addEventListener('click', function(e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  var cmd = btn.getAttribute('data-cmd');
  if (cmd === 'open-set') { document.getElementById('s-key').value=localStorage.getItem('g_key')||''; document.getElementById('m-set').style.display='flex'; }
  else if (cmd === 'close-set') { document.getElementById('m-set').style.display='none'; }
  else if (cmd === 'open-add') { document.getElementById('m-title').textContent='收錄新植物'; document.getElementById('f-id').value=''; document.getElementById('f-name').value=''; document.getElementById('f-url').value=''; document.getElementById('f-note').value=''; tmpImg=''; document.getElementById('m-plant').style.display='flex'; }
  else if (cmd === 'close-add') { document.getElementById('m-plant').style.display='none'; }
  else if (cmd === 'tab-dex') { document.getElementById('sec-dex').style.display='block'; document.getElementById('sec-logs').style.display='none'; document.getElementById('nb-dex').className='nav-btn active'; document.getElementById('nb-logs').className='nav-btn'; }
  else if (cmd === 'tab-logs') { document.getElementById('sec-dex').style.display='none'; document.getElementById('sec-logs').style.display='block'; document.getElementById('nb-logs').className='nav-btn active'; document.getElementById('nb-dex').className='nav-btn'; }
  else if (cmd === 'toggle-ai') { var w=document.getElementById('ai-win'); w.style.display = w.style.display==='flex' ? 'none' : 'flex'; }
