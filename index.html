<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1B4332" />
  <title>植誌 BOTANICA・跨領域植物圖鑑</title>
  <link id="dynamic-manifest" rel="manifest" href="manifest.json" />
  <script>
    (function() {
      try {
        var c = document.createElement('canvas');
        c.width = 512;
        c.height = 512;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#ccff00';
        ctx.fillRect(0, 0, 512, 512);
        ctx.strokeStyle = '#111111';
        ctx.lineWidth = 20;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(210, 215);
        ctx.bezierCurveTo(195, 130, 238, 120, 256, 195);
        ctx.bezierCurveTo(274, 120, 317, 130, 302, 215);
        ctx.bezierCurveTo(350, 225, 365, 295, 322, 338);
        ctx.bezierCurveTo(280, 375, 195, 370, 172, 322);
        ctx.bezierCurveTo(150, 275, 172, 225, 210, 215);
        ctx.stroke();
        ctx.fillStyle = '#111111';
        ctx.beginPath();
        ctx.arc(236, 276, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(276, 276, 11, 0, Math.PI * 2);
        ctx.fill();

        var pngUrl = c.toDataURL('image/png');
        var iconLink = document.createElement('link');
        iconLink.rel = 'apple-touch-icon';
        iconLink.href = pngUrl;
        document.head.appendChild(iconLink);

        var manifestObj = {
          name: "植誌 BOTANICA・跨領域植物圖鑑",
          short_name: "植誌",
          start_url: window.location.href,
          display: "standalone",
          background_color: "#F7F5F0",
          theme_color: "#1B4332",
          icons: [
            { src: pngUrl, sizes: "192x192", type: "image/png" },
            { src: pngUrl, sizes: "512x512", type: "image/png" }
          ]
        };
        var blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        document.getElementById('dynamic-manifest').href = URL.createObjectURL(blob);
      } catch (e) {}
    })();
  </script>
  <script src="https://tailwindcss.com"></script>
  <style>
    @import url('https://googleapis.com');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #F7F5F0;
      color: #2D312E;
      -webkit-tap-highlight-color: transparent;
    }
    .font-serif-title { font-family: 'Noto Serif TC', serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-28">

  <!-- 頂部植物誌標頭 -->
  <header class="bg-[#F7F5F0]/95 backdrop-blur-md sticky top-0 z-30 border-b border-[#E6E2D8]">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-xl">🌿</span>
          <h1 class="font-serif-title text-lg sm:text-xl font-bold tracking-wider text-[#1B4332]">植誌 BOTANICA</h1>
        </div>
        <p class="text-[11px] text-[#6B706C] mt-0.5">跨領域植物圖鑑・即時養護手札</p>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="openSettingsModal()" class="w-9 h-9 rounded-full bg-white border border-[#E2DDD2] flex items-center justify-center text-sm shadow-sm active:scale-95 transition">⚙️</button>
        <button type="button" onclick="openPlantModal()" class="bg-[#1B4332] text-[#F7F5F0] text-xs font-bold px-4 py-2.5 rounded-full shadow-sm active:scale-95 transition flex items-center gap-1">
          <span>＋</span> 收錄新植物
        </button>
      </div>
    </div>

    <!-- 狀態摘要＋搜尋＋分類篩選 -->
    <div class="max-w-5xl mx-auto px-4 pb-3 space-y-2.5">
      <div class="flex items-center gap-2 text-xs">
        <span class="bg-white border border-[#E6E2D8] px-3 py-1 rounded-full text-[#4A4E4B] shrink-0">
          總收錄 <strong id="stat-total" class="text-[#1B4332] ml-0.5">0</strong>
        </span>
        <span class="bg-[#FFF4E5] border border-[#F5D7B0] px-3 py-1 rounded-full text-[#9C5700] shrink-0">
          待補水 <strong id="stat-due" class="ml-0.5">0</strong>
        </span>
        <input type="text" id="search-input" oninput="renderPlants()" placeholder="搜尋植物..." class="flex-1 min-w-0 bg-white border border-[#E6E2D8] rounded-full px-3.5 py-1 text-xs focus:outline-none focus:border-[#1B4332]" />
      </div>
      <div id="category-filters" class="flex gap-2 overflow-x-auto no-scrollbar pb-0.5"></div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-5xl mx-auto px-4 pt-4">
    <!-- 分頁 1：植物圖鑑卡片牆 -->
    <section id="view-dex" style="display: block;">
      <div id="plant-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- 分頁 2：即時養護日誌時間軸 -->
    <section id="view-logs" style="display: none;" class="max-w-2xl mx-auto">
      <div class="bg-white rounded-3xl p-5 shadow-sm border border-[#EAE6DC]">
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-[#F0EDE6]">
          <h2 class="font-serif-title font-bold text-base text-[#1B4332]">即時養護動態手札</h2>
          <span class="text-[11px] bg-[#E8F3EE] text-[#1B4332] px-2.5 py-0.5 rounded-full font-medium">共 <span id="stat-logs">0</span> 筆紀錄</span>
        </div>
        <div id="log-feed" class="space-y-4"></div>
      </div>
    </section>
  </main>

  <!-- 操作成功浮動提示條 -->
  <div id="toast" style="display: none;" class="fixed top-20 left-1/2 -translate-x-1/2 bg-[#1B4332] text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg z-50"></div>

  <!-- 右下角 AI 顧問懸浮鈕 -->
  <button type="button" onclick="toggleAIChat()" class="fixed bottom-20 right-4 bg-[#1B4332] text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center text-xl z-40 border-2 border-[#F7F5F0] active:scale-90 transition">
    ✨
  </button>

  <!-- 底部雙分頁導覽列 -->
  <nav class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-[#E6E2D8] z-30">
    <div class="max-w-md mx-auto flex justify-around py-2">
      <button type="button" onclick="switchTab('dex')" id="tab-dex" class="flex flex-col items-center gap-0.5 text-[#1B4332] font-bold text-xs px-8 py-1">
        <span class="text-lg">🪴</span>
        <span>植物圖鑑</span>
      </button>
      <button type="button" onclick="switchTab('logs')" id="tab-logs" class="flex flex-col items-center gap-0.5 text-[#8C918D] font-medium text-xs px-8 py-1">
        <span class="text-lg">📖</span>
        <span>即時日誌</span>
      </button>
    </div>
  </nav>

  <!-- AI 園藝顧問懸浮對話框 -->
  <div id="ai-chat-window" style="display: none; height: 430px;" class="fixed bottom-36 right-4 left-4 sm:left-auto sm:w-96 bg-white rounded-3xl shadow-2xl border border-[#E2DDD2] z-40 flex-col overflow-hidden">
    <div class="bg-[#1B4332] text-[#F7F5F0] px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-lg">✨</span>
        <div>
          <div class="font-bold text-sm">AI 跨領域植物顧問</div>
          <div class="text-[10px] text-[#B7E4C7]">養護諮詢・貼上舊對話自動建檔</div>
        </div>
      </div>
      <button type="button" onclick="toggleAIChat()" class="text-white/80 hover:text-white text-lg px-2">✕</button>
    </div>
    <div class="bg-[#F2EFE9] px-3 py-2 flex gap-1.5 overflow-x-auto no-scrollbar border-b border-[#E6E2D8] text-[11px] shrink-0">
      <button type="button" onclick="fillPrompt('請幫我檢查目前圖鑑中，哪些植物今天需要特別注意濕度或澆水？')" class="bg-white border border-[#DCD7CC] text-[#1B4332] px-2.5 py-1 rounded-full whitespace-nowrap">💧 今日巡檢建議</button>
      <button type="button" onclick="fillPrompt('請從以下文字幫我提取植物並轉成 JSON 格式新增到圖鑑：\n[貼上你的植物筆記或舊對話]')" class="bg-white border border-[#DCD7CC] text-[#1B4332] px-2.5 py-1 rounded-full whitespace-nowrap">📥 文字批量匯入</button>
    </div>
    <div id="ai-messages" class="flex-1 p-3.5 overflow-y-auto space-y-3 text-xs leading-relaxed bg-[#FAF8F5]">
      <div class="bg-white p-3.5 rounded-2xl rounded-tl-none shadow-sm border border-[#EAE6DC] text-[#3A3F3B]">
        你好！我是你的專屬植物顧問。你可以直接問我鹿角蕨、橄欖科或任何領域植物的照顧細節，或是點擊上方<strong>「文字批量匯入」</strong>把植物清單交給我自動建立圖鑑卡片。
      </div>
    </div>
    <div class="p-2.5 bg-white border-t border-[#EAE6DC] flex gap-2">
      <textarea id="ai-input" rows="1" placeholder="輸入問題或貼上紀錄..." class="flex-1 bg-[#F7F5F0] rounded-2xl px-3.5 py-2 text-xs focus:outline-none resize-none"></textarea>
      <button type="button" onclick="sendAIMessage()" class="bg-[#1B4332] text-white px-4 rounded-2xl font-bold text-xs">送出</button>
    </div>
  </div>

  <!-- 新增/編輯植物彈出視窗 -->
  <div id="plant-modal" style="display: none;" class="fixed inset-0 bg-black/50 z-50 items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-3xl max-w-md w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modal-title" class="font-serif-title text-lg font-bold text-[#1B4332]">收錄新植物至圖鑑</h3>
        <button type="button" onclick="closePlantModal()" class="w-8 h-8 rounded-full bg-[#F7F5F0] text-gray-600 flex items-center justify-center">✕</button>
      </div>
      <div class="space-y-3.5 text-xs">
        <input type="hidden" id="plant-id" />
        <div>
          <label class="block font-bold text-[#4A4E4B] mb-1">植物名稱 *</label>
          <input type="text" id="plant-name" placeholder="例如：女王鹿角蕨、神聖乳香、象牙宮" class="w-full bg-[#F7F5F0] border border-[#E2DDD2] rounded-xl px-3.5 py-2.5 text-sm" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-[#4A4E4B] mb-1">所屬領域 *</label>
            <select id="plant-category" class="w-full bg-[#F7F5F0] border border-[#E2DDD2] rounded-xl px-3 py-2.5 text-sm">
