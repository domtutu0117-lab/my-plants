<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1B4332" />
  <title>植誌 BOTANICA・跨領域植物圖鑑</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://tailwindcss.com"></script>
  <style>
    @import url('https://googleapis.com');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #F7F5F0;
      color: #2D312E;
      -webkit-tap-highlight-color: transparent;
    }
    .font-serif-title { font-family: 'Noto Serif TC', serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- 頂部極簡植物誌標頭 -->
  <header class="bg-[#F7F5F0]/90 backdrop-blur-md sticky top-0 z-30 border-b border-[#E6E2D8]">
    <div class="max-w-5xl mx-auto px-5 py-4 flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-xl">🌿</span>
          <h1 class="font-serif-title text-xl font-bold tracking-wider text-[#1B4332]">植誌 BOTANICA</h1>
        </div>
        <p class="text-[11px] text-[#6B706C] tracking-wide mt-0.5">跨領域植物圖鑑・即時養護手札</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openSettingsModal()" class="w-9 h-9 rounded-full bg-white border border-[#E2DDD2] flex items-center justify-center text-sm shadow-sm active:scale-95 transition" title="設定">⚙️</button>
        <button onclick="openPlantModal()" class="bg-[#1B4332] hover:bg-[#2D6A4F] text-[#F7F5F0] text-xs font-medium px-4 py-2.5 rounded-full shadow-sm active:scale-95 transition flex items-center gap-1">
          <span>＋</span> 收錄新植物
        </button>
      </div>
    </div>

    <!-- 膠囊式狀態摘要＋領域橫向滑動篩選 -->
    <div class="max-w-5xl mx-auto px-5 pb-3 space-y-3">
      <div class="flex items-center gap-2 text-xs">
        <span class="bg-white border border-[#E6E2D8] px-3 py-1 rounded-full text-[#4A4E4B]">
          總收錄 <strong id="stat-total" class="text-[#1B4332] ml-0.5">0</strong>
        </span>
        <span class="bg-[#FFF4E5] border border-[#F5D7B0] px-3 py-1 rounded-full text-[#9C5700]">
          今日待補水 <strong id="stat-due" class="ml-0.5">0</strong>
        </span>
        <div class="flex-1 relative">
          <input type="text" id="search-input" oninput="renderPlants()" placeholder="搜尋植物..." class="w-full bg-white border border-[#E6E2D8] rounded-full px-3.5 py-1 text-xs focus:outline-none focus:border-[#1B4332]" />
        </div>
      </div>
      <div id="category-filters" class="flex gap-2 overflow-x-auto no-scrollbar pb-0.5"></div>
    </div>
  </header>

  <!-- 主視圖容器 -->
  <main class="max-w-5xl mx-auto px-5 pt-5">
    
    <!-- 分頁 1：植物圖鑑卡片牆 -->
    <section id="view-dex">
      <div id="plant-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </section>

    <!-- 分頁 2：即時養護日誌時間軸 -->
    <section id="view-logs" class="hidden max-w-2xl mx-auto">
      <div class="bg-white rounded-3xl p-5 shadow-sm border border-[#EAE6DC]">
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-[#F0EDE6]">
          <h2 class="font-serif-title font-bold text-base text-[#1B4332]">即時養護動態手札</h2>
          <span class="text-[11px] bg-[#E8F3EE] text-[#1B4332] px-2.5 py-0.5 rounded-full font-medium">共 <span id="stat-logs">0</span> 筆紀錄</span>
        </div>
        <div id="log-feed" class="space-y-4"></div>
      </div>
    </section>

  </main>

  <!-- 右下角質感 AI 顧問懸浮鈕 -->
  <button onclick="toggleAIChat()" class="fixed bottom-20 right-5 bg-[#1B4332] text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center text-xl z-40 border-2 border-[#F7F5F0] active:scale-90 transition" title="AI 植物顧問">
    ✨
  </button>

  <!-- 底部原生 App 風格雙分頁切換列 -->
  <nav class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-[#E6E2D8] z-30">
    <div class="max-w-md mx-auto flex justify-around py-2">
      <button onclick="switchTab('dex')" id="tab-dex" class="flex flex-col items-center gap-0.5 text-[#1B4332] font-bold text-xs px-6 py-1">
        <span class="text-lg">🪴</span>
        <span>植物圖鑑</span>
      </button>
      <button onclick="switchTab('logs')" id="tab-logs" class="flex flex-col items-center gap-0.5 text-[#8C918D] font-medium text-xs px-6 py-1">
        <span class="text-lg">📖</span>
        <span>即時日誌</span>
      </button>
    </div>
  </nav>

  <!-- AI 園藝顧問懸浮對話框 -->
  <div id="ai-chat-window" class="hidden fixed bottom-36 right-4 sm:right-6 w-[calc(100%-2rem)] sm:w-96 bg-white rounded-3xl shadow-2xl border border-[#E2DDD2] z-40 flex flex-col overflow-hidden" style="height: 440px;">
    <div class="bg-[#1B4332] text-[#F7F5F0] px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-lg">✨</span>
        <div>
          <div class="font-bold text-sm tracking-wide">AI 跨領域植物顧問</div>
          <div class="text-[10px] text-[#B7E4C7]">養護諮詢・貼上舊對話自動建檔</div>
        </div>
      </div>
      <button onclick="toggleAIChat()" class="text-white/70 hover:text-white text-base">✕</button>
    </div>
    <div class="bg-[#F2EFE9] px-3 py-2 flex gap-1.5 overflow-x-auto no-scrollbar border-b border-[#E6E2D8] text-[11px] shrink-0">
      <button onclick="fillPrompt('請幫我檢查目前圖鑑中，哪些植物今天需要特別注意濕度或澆水？')" class="bg-white border border-[#DCD7CC] text-[#1B4332] px-2.5 py-1 rounded-full whitespace-nowrap">💧 今日巡檢建議</button>
      <button onclick="fillPrompt('請從以下文字幫我提取植物並轉成 JSON 格式新增到圖鑑：\n[貼上你的植物筆記或舊對話]')" class="bg-white border border-[#DCD7CC] text-[#1B4332] px-2.5 py-1 rounded-full whitespace-nowrap">📥 文字批量匯入</button>
    </div>
    <div id="ai-messages" class="flex-1 p-3.5 overflow-y-auto space-y-3 text-xs leading-relaxed bg-[#FAF8F5]">
      <div class="bg-white p-3.5 rounded-2xl rounded-tl-none shadow-sm border border-[#EAE6DC] text-[#3A3F3B]">
        你好！我是你的專屬植物顧問。你可以直接問我不同領域植物的照顧細節，或是點擊上方<strong>「文字批量匯入」</strong>把植物清單交給我自動建立圖鑑卡片。
      </div>
    </div>
    <div class="p-2.5 bg-white border-t border-[#EAE6DC] flex gap-2">
      <textarea id="ai-input" rows="1" placeholder="輸入問題或貼上紀錄..." class="flex-1 bg-[#F7F5F0] rounded-2xl px-3.5 py-2 text-xs focus:outline-none resize-none"></textarea>
      <button onclick="sendAIMessage()" class="bg-[#1B4332] text-white px-4 rounded-2xl font-bold text-xs">送出</button>
    </div>
  </div>

  <!-- 新增/編輯植物 Modal -->
  <div id="plant-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-3xl max-w-md w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modal-title" class="font-serif-title text-lg font-bold text-[#1B4332]">收錄植物至圖鑑</h3>
        <button onclick="closePlantModal()" class="w-8 h-8 rounded-full bg-[#F7F5F0] text-gray-500 flex items-center justify-center">✕</button>
      </div>
      <form id="plant-form" onsubmit="savePlant(event)" class="space-y-3.5 text-xs">
        <input type="hidden" id="plant-id" />
        <div>
          <label class="block font-bold text-[#4A4E4B] mb-1">植物名稱 *</label>
          <input type="text" id="plant-name" required placeholder="例如：白錦龜背竹、象牙宮" class="w-full bg-[#F7F5F0] border border-[#E2DDD2] rounded-xl px-3.5 py-2.5 text-sm" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-[#4A4E4B] mb-1">所屬領域 *</label>
            <select id="plant-category" class="w-full bg-[#F7F5F0] border border-[#E2DDD2] rounded-xl px-3 py-2.5 text-sm">
              <option value="雨林觀葉">🌿 雨林觀葉</option>
              <option value="塊根植物">🥔 塊根植物</option>
              <option value="食蟲植物">🪤 食蟲植物</option>
              <option value="附生蕨類">🦌 附生蕨類</option>
              <option value="沙漠多肉">🌵 沙漠多肉</option>
              <option value="蘭科植物">🌸 蘭科植物</option>
              <option value="水生苔蘚">💧 水生苔蘚</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-[#4A4E4B] mb-1">澆水週期 (天) *</label>
            <input type="number" id="plant-interval" required min="1" max="90" value="4" class="w-full bg-[#F7F5F0] border border-[#E2DDD2] rounded-xl px-3.5 py-2.5 text-sm" />
          </div>
        </div>
        <div>
          <label class="block font-bold text-[#4A4E4B] mb-1">實拍照片 或 網路圖片網址</label>
          <div class="space-y-2 bg-[#F7F5F0] p-3 rounded-2xl border border-[#E2DDD2]">
            <input type="file" id="plant-file" accept="image/*" onchange="handleImageUpload(event)" class="block w-full text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:bg-[#1B4332] file:text-white file:text-xs" />
            <input type="url" id="plant-image-url" placeholder="或貼上真實植物圖片網址 https://..." oninput="previewImageUrl()" class="w-full bg-white border border-[#E2DDD2] rounded-xl px-3 py-2 text-xs" />
            <img id="image-preview" src="" alt="預覽圖" class="hidden w-full h-40 object-cover rounded-xl mt-2" />
          </div>
        </div>
        <div>
          <label class="block font-bold text-[#4A4E4B] mb-1">養護手札與介質筆記</label>
          <textarea id="plant-notes" rows="2" placeholder="記錄光照需求、濕度或介質比例..." class="w-full bg-[#F7F5F0] border border-[#E2DDD2] rounded-xl px-3.5 py-2.5 text-sm"></textarea>
        </div>
        <button type="submit" class="w-full py-3 rounded-full bg-[#1B4332] text-white font-bold text-sm shadow-md active:scale-98 transition">儲存至我的圖鑑</button>
      </form>
    </div>
  </div>

  <!-- 設定與備份 Modal -->
