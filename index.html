<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#064e3b" />
  <title>我的跨領域植物圖鑑</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://tailwindcss.com"></script>
  <style>
    @import url('https://googleapis.com');
    body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f6f4; color: #1f2937; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #e5e7eb; }
    ::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-emerald-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🌿</span>
        <div>
          <h1 class="text-xl font-bold tracking-wide">跨領域植物圖鑑與即時日誌</h1>
          <p class="text-xs text-emerald-200">支援實拍照片上傳・自動計算澆水週期・內建 AI 園藝顧問</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openPlantModal()" class="bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-bold px-4 py-2 rounded-lg text-sm transition flex items-center gap-1 shadow">
          <span>＋</span> 新增植物
        </button>
        <button onclick="openSettingsModal()" class="bg-emerald-800 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-sm transition border border-emerald-700">
          ⚙️ 設定
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl w-full mx-auto px-4 py-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">
    <section class="lg:col-span-8 flex flex-col gap-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col sm:flex-row justify-between gap-3">
        <div id="category-filters" class="flex flex-wrap gap-2"></div>
        <input type="text" id="search-input" oninput="renderPlants()" placeholder="搜尋植物名稱或筆記..." class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 w-full sm:w-56" />
      </div>
      <div id="plant-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    </section>

    <aside class="lg:col-span-4 flex flex-col gap-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-base font-bold text-gray-800 mb-3 flex items-center gap-2"><span>📊</span> 溫室即時狀態總覽</h2>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-emerald-50 p-2.5 rounded-lg">
            <div id="stat-total" class="text-xl font-bold text-emerald-700">0</div>
            <div class="text-xs text-gray-600">收錄植物</div>
          </div>
          <div class="bg-amber-50 p-2.5 rounded-lg">
            <div id="stat-due" class="text-xl font-bold text-amber-600">0</div>
            <div class="text-xs text-gray-600">今日需補水</div>
          </div>
          <div class="bg-blue-50 p-2.5 rounded-lg">
            <div id="stat-logs" class="text-xl font-bold text-blue-600">0</div>
            <div class="text-xs text-gray-600">累計日誌</div>
          </div>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex-1 flex flex-col max-h-[650px]">
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-gray-100">
          <h2 class="text-base font-bold text-gray-800 flex items-center gap-2"><span>🕒</span> 即時養護日誌動態</h2>
          <span class="text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full font-medium">即時同步</span>
        </div>
        <div id="log-feed" class="overflow-y-auto space-y-3 pr-1 flex-1"></div>
      </div>
    </aside>
  </main>

  <button onclick="toggleAIChat()" class="fixed bottom-6 right-6 bg-emerald-700 hover:bg-emerald-600 text-white w-14 h-14 rounded-full shadow-xl flex items-center justify-center text-2xl transition-transform hover:scale-105 z-40 border-2 border-white">🤖</button>

  <div id="ai-chat-window" class="hidden fixed bottom-24 right-4 sm:right-6 w-[calc(100%-2rem)] sm:w-96 bg-white rounded-2xl shadow-2xl border border-gray-200 z-40 flex flex-col overflow-hidden" style="height: 460px;">
    <div class="bg-emerald-800 text-white px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">🌿</span>
        <div>
          <div class="font-bold text-sm">AI 跨領域植物顧問</div>
          <div class="text-[11px] text-emerald-200">問診養護或貼上舊對話批量匯入</div>
        </div>
      </div>
      <button onclick="toggleAIChat()" class="text-emerald-200 hover:text-white text-lg font-bold">✕</button>
    </div>
    <div class="bg-emerald-50 px-3 py-2 flex gap-1.5 overflow-x-auto border-b border-emerald-100 text-xs shrink-0">
      <button onclick="fillPrompt('請幫我檢查目前圖鑑中，哪些植物今天需要特別注意濕度或澆水？')" class="bg-white border border-emerald-200 text-emerald-800 px-2 py-1 rounded whitespace-nowrap">💧 今日巡檢建議</button>
      <button onclick="fillPrompt('請從以下文字幫我提取植物並轉成 JSON 格式新增到圖鑑：\n[在此貼上你的聊天紀錄]')" class="bg-white border border-emerald-200 text-emerald-800 px-2 py-1 rounded whitespace-nowrap">📥 貼上舊對話匯入</button>
    </div>
    <div id="ai-messages" class="flex-1 p-3 overflow-y-auto space-y-3 text-sm bg-gray-50">
      <div class="bg-white p-3 rounded-xl rounded-tl-none shadow-sm border border-gray-100 text-gray-700">
        你好！我是你的專屬植物管家。請先點右上角「⚙️ 設定」填入免費 Gemini API Key 即可啟用對話與自動匯入功能。
      </div>
    </div>
    <div class="p-2.5 bg-white border-t border-gray-200 flex gap-2">
      <textarea id="ai-input" rows="2" placeholder="輸入問題或貼上植物紀錄..." class="flex-1 border border-gray-300 rounded-lg px-2.5 py-1.5 text-sm resize-none"></textarea>
      <button onclick="sendAIMessage()" class="bg-emerald-700 text-white px-3 rounded-lg font-bold text-sm">送出</button>
    </div>
  </div>

  <div id="plant-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modal-title" class="text-lg font-bold text-gray-800">新增植物至圖鑑</h3>
        <button onclick="closePlantModal()" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
      </div>
      <form id="plant-form" onsubmit="savePlant(event)" class="space-y-3 text-sm">
        <input type="hidden" id="plant-id" />
        <div>
          <label class="block font-medium text-gray-700 mb-1">植物名稱 *</label>
          <input type="text" id="plant-name" required class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-gray-700 mb-1">所屬領域分類 *</label>
            <select id="plant-category" class="w-full border border-gray-300 rounded-lg px-3 py-2">
              <option value="雨林觀葉">🌿 雨林觀葉</option>
              <option value="塊根植物">🥔 塊根植物</option>
              <option value="食蟲植物">🪤 食蟲植物</option>
              <option value="附生蕨類">🦌 附生蕨類</option>
              <option value="沙漠多肉">🌵 沙漠多肉</option>
              <option value="蘭科植物">🌸 蘭科植物</option>
              <option value="水生苔蘚">💧 水生苔蘚</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-gray-700 mb-1">澆水週期 (天) *</label>
            <input type="number" id="plant-interval" required min="1" max="90" value="4" class="w-full border border-gray-300 rounded-lg px-3 py-2" />
          </div>
        </div>
        <div>
          <label class="block font-medium text-gray-700 mb-1">植物照片（實拍上傳 或 網路圖片網址）</label>
          <div class="space-y-2 bg-gray-50 p-3 rounded-lg border border-gray-200">
            <input type="file" id="plant-file" accept="image/*" onchange="handleImageUpload(event)" class="block w-full text-xs text-gray-500" />
            <input type="url" id="plant-image-url" placeholder="或貼上網路圖片網址 https://..." oninput="previewImageUrl()" class="w-full border border-gray-300 rounded-lg px-2.5 py-1.5 text-xs bg-white" />
            <img id="image-preview" src="" alt="預覽圖" class="hidden w-full h-36 object-cover rounded-lg mt-2 border" />
          </div>
        </div>
        <div>
          <label class="block font-medium text-gray-700 mb-1">養護要點與環境筆記</label>
          <textarea id="plant-notes" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closePlantModal()" class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700">取消</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-emerald-700 text-white font-bold">儲存圖鑑</button>
        </div>
      </form>
    </div>
  </div>

  <div id="settings-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-gray-800">⚙️ 系統設定與資料備份</h3>
        <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
      </div>
      <div class="text-sm space-y-2">
        <label class="block font-bold text-gray-700">Google Gemini API Key</label>
        <input type="password" id="gemini-api-key" placeholder="AIzaSy..." class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        <button onclick="saveApiKey()" class="w-full bg-emerald-700 text-white font-bold py-2 rounded-lg">儲存 API Key</button>
      </div>
      <hr />
